<!doctype html>
<!-- ThreadCrew window, served by the broker, which adds the window.__AGENT_CHAT__ bootstrap.
     Start it with `npm.cmd start`, or `node ui/dev-broker.mjs` for fake agents. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ThreadCrew</title>
  <script src="i18n.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><strong>ThreadCrew</strong><span>Codex &amp; Claude</span></div>
      <div class="members" id="members"></div>
      <button id="stop" class="stop" type="button" disabled>Stop</button>
    </header>

    <div id="notice" class="notice" role="status" hidden></div>

    <main class="timeline" id="timeline" role="log" aria-live="polite" aria-label="Conversation"></main>

    <footer class="composer">
      <div class="composer-inner">
        <div class="recipients">
          <span>To</span>
          <button id="to-codex" class="to to-codex" type="button" aria-pressed="true">Codex</button>
          <button id="to-claude" class="to to-claude" type="button" aria-pressed="true">Claude</button>
          <span id="to-hint" class="hint"></span>
          <span class="format-tools" role="toolbar" aria-label="Formatting">
            <button type="button" class="fmt" data-fmt="bold" title="Bold (Ctrl+B)"><strong>B</strong></button>
            <button type="button" class="fmt" data-fmt="list" title="List">• List</button>
            <button type="button" class="fmt" data-fmt="code" title="Code">&lt;/&gt;</button>
            <button type="button" class="fmt" data-fmt="quote" title="Quote">❝</button>
            <button type="button" id="preview-toggle" class="fmt" aria-pressed="false" title="Preview the formatting">Preview</button>
          </span>
        </div>
        <div id="preview" class="preview md" hidden></div>
        <div class="composer-row">
          <textarea id="input" rows="1" placeholder="Write a message (Enter to send, Shift+Enter for a new line)" aria-label="Message, Enter to send, Shift+Enter for a new line"></textarea>
          <button id="send" class="primary" type="button" disabled>Send</button>
        </div>
        <div class="composer-note" id="composer-note" aria-live="polite"></div>
      </div>
    </footer>
  </div>

  <script src="markdown.js"></script>
  <script src="boot.js"></script>
</body>
</html>
